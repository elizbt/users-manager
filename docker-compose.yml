services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: users_manager
      POSTGRES_USER: users_manager
      POSTGRES_PASSWORD: users_manager
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U users_manager -d users_manager"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
